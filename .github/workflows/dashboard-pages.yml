name: nvsim Dashboard → GitHub Pages

# Deploys the nvsim Vite/Lit dashboard to gh-pages/nvsim/
# Fixed: wasm-pack out-dir must be ../dashboard (from v2/), not ../../dashboard

on:
  push:
    branches: [main]
    paths:
      - 'v2/crates/nvsim/**'
      - 'dashboard/**'
      - '.github/workflows/dashboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/target
          key: ${{ runner.os }}-cargo-nvsim-${{ hashFiles('v2/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-nvsim-

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          which wasm-pack

      - name: Build nvsim WASM
        working-directory: v2
        run: |
          # From v2/, one level up is repo root → dashboard/public/nvsim-pkg
          wasm-pack build crates/nvsim \
            --target web \
            --out-dir ../dashboard/public/nvsim-pkg \
            --release \
            -- --no-default-features --features wasm
          echo "=== nvsim-pkg contents ==="
          ls -la ../dashboard/public/nvsim-pkg

      - name: Setup Node 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        env:
          # Netlify serves at /nvsim/ ; GitHub project pages use repo name prefix
          NVSIM_BASE: /nvsim/
        run: |
          npm run build
          echo "=== dist contents ==="
          ls -la dist
          ls -la dist/nvsim-pkg || echo "WARNING: nvsim-pkg missing from dist"

      - name: Deploy to gh-pages/nvsim/
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard/dist
          destination_dir: nvsim
          keep_files: true
          commit_message: 'deploy(nvsim): ${{ github.sha }}'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
